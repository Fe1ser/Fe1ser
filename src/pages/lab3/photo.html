<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .photo {
            margin: 10px;
            text-align: center;
        }
        .photo img {
            width: 200px; 
            height: auto;
            border: 2px solid #ccc;
            border-radius: 5px;
        }
        .photo p {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Фотогалерея</h1>

    <div class="gallery">
        <div class="photo">
            <a href="originals/photo1.jpg" target="_blank">
                <img src="thumbnails/photo1_thumb.jpg" alt="Фото 1">
            </a>
            <p>Назва: Фото 1</p>
            <p>Розмір оригіналу: 1200x800</p>
        </div>
        <!-- Додайте інші мініатюри зображень -->
        <div class="photo">
            <a href="originals/photo2.jpg" target="_blank">
                <img src="thumbnails/photo2_thumb.jpg" alt="Фото 2">
            </a>
            <p>Назва: Фото 2</p>
            <p>Розмір оригіналу: 1600x1200</p>
        </div>
        <!-- Додайте інші мініатюри зображень -->
    </div>
</body>
</html>
